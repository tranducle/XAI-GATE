[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-surfacebench"
version = "0.2.0"
description = "XAI-Gate explanation-surface governance and XAI-SurfaceBench evaluation framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Tran Duc Le"},
  {name = "Truong Duy Dinh"},
  {name = "Phuc Hao Do"},
  {name = "Van Dai Pham"},
]
dependencies = [
  "numpy==2.4.6",
  "pandas==2.3.3",
  "scipy==1.17.1",
  "scikit-learn==1.8.0",
  "joblib==1.5.3",
  "pyarrow==24.0.0",
  "lime==0.2.0.1",
  "shap==0.51.0",
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
